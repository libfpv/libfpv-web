services:
  libfpv-web:
    build: .
    image: libfpv-web
    container_name: libfpv-web
    restart: always
    # nginx (docker-nginx, host network) proxies libfpv.com to this port
    ports:
      - 127.0.0.1:3010:3000
    healthcheck:
      test: wget -qO /dev/null http://127.0.0.1:3000/ || exit 1
      timeout: 30s
      interval: 1m
      retries: 3
      start_period: 30s
